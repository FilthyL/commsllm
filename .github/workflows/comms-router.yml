name: COMMS router
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
concurrency:
  group: comms-live-state
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Apply trusted COMMS state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/router.py route
